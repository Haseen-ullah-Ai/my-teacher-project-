[project]
name = "researchpilot"
version = "0.1.0"
description = "ResearchPilot backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.0",
  "uvicorn[standard]==0.30.6",
  "pydantic==2.9.2",
  "pydantic-settings==2.5.2",
  "sqlalchemy[asyncio]==2.0.36",
  "asyncpg==0.30.0",
  "alembic==1.13.3",
  "langgraph==1.2.14",
  "structlog==24.4.0",
  "tenacity==9.0.0",
  "httpx==0.27.2",
  "pandas==2.2.3",
  "numpy==2.2.6",
  "reportlab==4.2.5",
  "jinja2==3.1.6",
  "python-multipart==0.0.9",
  "prometheus-client==0.21.0",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "pytest-asyncio==0.24.0",
  "pytest-cov==6.0.0",
  "httpx==0.27.2",
  "ruff==0.6.9",
  "mypy==1.19.1",
  "pre-commit==4.0.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--cov=app", "--cov-fail-under=85"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = ["app.tools.csv_reader", "app.tools.report_generator"]
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["numpy", "numpy.*"]
follow_imports = "skip"
