name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: researchpilot_test
          POSTGRES_USER: researchpilot
          POSTGRES_PASSWORD: researchpilot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U researchpilot -d researchpilot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql+asyncpg://researchpilot:researchpilot_test@localhost:5432/researchpilot_test
      TEST_DATABASE_URL: postgresql+asyncpg://researchpilot:researchpilot_test@localhost:5432/researchpilot_test
      LLM_PROVIDER: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Ruff
        working-directory: backend
        run: python -m ruff check app tests evals
      - name: Strict mypy
        working-directory: backend
        run: python -m mypy app
      - name: Pytest with coverage
        working-directory: backend
        run: python -m pytest -q --cov-report=xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run type-check --prefix frontend
      - run: npm test --prefix frontend
      - run: npm run build --prefix frontend

  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Run deterministic mock evaluations
        working-directory: backend
        run: python -m evals.run
      - uses: actions/upload-artifact@v4
        with:
          name: evaluation-results
          path: backend/evals/results/latest.json

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          tags: researchpilot-backend:ci
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            VITE_API_BASE_URL=
          push: false
          tags: researchpilot-frontend:ci
